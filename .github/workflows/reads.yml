name: IQ Scan + AI Reads

on:
  schedule:
    # GitHub throttles short crons heavily; 30 min nominal, expect 30-60 real.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: reads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-reads:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -q -r ai/worker/requirements.txt
          if [[ -f requirements.txt ]]; then pip install -q -r requirements.txt; fi

      - name: Run scanner (writes docs/iq/scan.json; no API key needed)
        env:
          UNIVERSE_TOP: "1000"
          # 10y so monthly bands/oscillator clear their 33-bar warm-up.
          BAR_RANGE: "10y"
        run: |
          python scanner.py --top "${UNIVERSE_TOP:-500}"

      - name: Triple-signal scan (30m + 2H vs daily; writes docs/iq/signals.json)
        run: |
          python intraday.py

      - name: Index membership lists (writes docs/iq/indexes.json and sp500.json)
        continue-on-error: true
        run: |
          python indexes.py

      - name: ETF and crypto heatmap feeds (writes docs/iq/etf.json and crypto.json)
        continue-on-error: true
        env:
          ETF_TOP: "500"
        run: |
          python heatmaps.py

      - name: Logos for new symbols (docs/logos, docs/iq/logos.json)
        continue-on-error: true
        run: |
          python logos.py

      - name: Generate AI reads
        env:
          # OpenRouter, the same provider and models as the site's ask function
          # (2026-09-16). OPENROUTER_API_KEY repo secret required; the step
          # skips without it. The old Groq path had failed since 2026-09-05
          # (llama-3.3-70b-versatile retired).
          LLM_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          LLM_PROVIDER: openrouter
          LLM_BASE_URL: https://openrouter.ai/api/v1
          LLM_MODEL:    anthropic/claude-haiku-4.5
          # Sonnet 5 only when Haiku fails (outage, rate limit, retired id)
          LLM_MODEL_FALLBACK: "anthropic/claude-sonnet-5"
          LLM_REASONING: none
          # The scanner just wrote docs/iq/scan.json in this same job — read
          # it locally instead of round-tripping through Pages (which would
          # lag one deploy behind).
          SCAN_BASE:    docs
          MAX_READS_PER_PASS: "25"
        run: |
          if [[ -z "$LLM_API_KEY" ]]; then
            echo "OPENROUTER_API_KEY not set, skipping reads"
            exit 0
          fi
          # Restore accumulated reads (fresh checkout has no ai/worker/out).
          mkdir -p ai/worker/out
          if [[ -f docs/ai/reads.json ]]; then cp docs/ai/reads.json ai/worker/out/reads.json; fi
          python ai/worker/worker.py --once
          cp ai/worker/out/reads.json docs/ai/reads.json
          cp ai/worker/out/status.json docs/ai/status.json 2>/dev/null || true

      - name: Commit + push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain docs/iq docs/ai docs/logos ai/worker/state)" ]]; then
            git add docs/iq docs/ai docs/logos ai/worker/state
            git commit -m "scan+reads @ $(date -u +'%Y-%m-%d %H:%M UTC') [actions]"
            # a code push can land mid-run; rebase our output commit on top
            # (rebase reverses ours/theirs: -X theirs keeps THIS run's files)
            git pull --rebase -X theirs origin main
            git push
          else
            echo "no changes"
          fi
