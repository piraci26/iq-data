name: IQ Scan + AI Reads

on:
  schedule:
    # GitHub throttles short crons heavily; 30 min nominal, expect 30-60 real.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: reads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-reads:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -q -r ai/worker/requirements.txt
          if [[ -f requirements.txt ]]; then pip install -q -r requirements.txt; fi

      - name: Run scanner (writes docs/iq/scan.json; no API key needed)
        env:
          UNIVERSE_TOP: "1000"
          # 10y so monthly bands/oscillator clear their 33-bar warm-up.
          BAR_RANGE: "10y"
        run: |
          python scanner.py --top "${UNIVERSE_TOP:-500}"

      - name: Triple-signal scan (30m + 2H vs daily; writes docs/iq/signals.json)
        run: |
          python intraday.py

      - name: Index membership lists (writes docs/iq/indexes.json and sp500.json)
        continue-on-error: true
        run: |
          python indexes.py

      - name: Generate AI reads
        env:
          # LLM_API_KEY repo secret (Groq key) required; step skips without it.
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL:    llama-3.3-70b-versatile
          # Groq free-tier caps are per model+day; when the 70B budget is
          # spent, the pass walks this chain instead of starving. gpt-oss-120b
          # is deliberately absent: it is reserved for the premium chat.
          LLM_MODEL_FALLBACK: "llama-3.1-8b-instant,qwen/qwen3.6-27b"
          # The scanner just wrote docs/iq/scan.json in this same job — read
          # it locally instead of round-tripping through Pages (which would
          # lag one deploy behind).
          SCAN_BASE:    docs
          MAX_READS_PER_PASS: "25"
        run: |
          if [[ -z "$LLM_API_KEY" ]]; then
            echo "LLM_API_KEY not set, skipping reads"
            exit 0
          fi
          # Restore accumulated reads (fresh checkout has no ai/worker/out).
          mkdir -p ai/worker/out
          if [[ -f docs/ai/reads.json ]]; then cp docs/ai/reads.json ai/worker/out/reads.json; fi
          python ai/worker/worker.py --once
          cp ai/worker/out/reads.json docs/ai/reads.json
          cp ai/worker/out/status.json docs/ai/status.json 2>/dev/null || true

      - name: Commit + push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain docs/iq docs/ai ai/worker/state)" ]]; then
            git add docs/iq docs/ai ai/worker/state
            git commit -m "scan+reads @ $(date -u +'%Y-%m-%d %H:%M UTC') [actions]"
            # a code push can land mid-run; rebase our output commit on top
            # (rebase reverses ours/theirs: -X theirs keeps THIS run's files)
            git pull --rebase -X theirs origin main
            git push
          else
            echo "no changes"
          fi
