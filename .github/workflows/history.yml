name: Chart history

# The charts' 1-minute sessions and daily years, from Alpaca (history.py), on
# their own clock: inside the 40-minute scan they only moved when a scan
# finished, and the scan's commit replaces docs/iq wholesale. This writes
# docs/hist only. Every half hour it fills whatever is missing; runs are cheap
# once the backfill is done.
on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

concurrency:
  group: history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1-minute sessions (docs/hist/bars_1m_days)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python history.py sessions

      # committed before the slow daily backfill, so the 1-minute charts get their weeks in minutes
      - name: Commit the sessions
        run: |
          bash .github/scripts/commit-hist.sh "chart history, 1-minute sessions"

      - name: Daily years (docs/hist/bars_1d_years)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          HIST_DAILY_BUDGET_S: "1200"
        run: python history.py daily

      - name: Commit the daily years
        run: |
          bash .github/scripts/commit-hist.sh "chart history, daily years"
